worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format gateway escape=json
        '{"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_time":"$request_time","upstream_response_time":"$upstream_response_time"}';
    access_log logs/ape04_access.log gateway;

    upstream vehiculos {
        server 127.0.0.1:8080 weight=3 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8082 weight=1 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 127.0.0.1:8090;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_intercept_errors off;
        proxy_next_upstream off;

        location = /nginx-ping {
            default_type text/plain;
            return 200 "pong\n";
        }

        # Incluye /api/vehiculos/{id}/reservas y deja pasar X-Service-Key.
        location ~ ^/(?:oauth/token$|api/identidad$|actuator/health$|api/(?:vehiculos|reservas)(?:/|$)) {
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 12s;
            proxy_pass http://vehiculos;
        }

        location ~ ^/api/(?:compradores|ventas)(?:/|$) {
            proxy_read_timeout 30s;
            proxy_pass http://127.0.0.1:8002;
        }

        # El servicio de notificaciones valida X-Notification-Key.
        location ~ ^/api/notificaciones(?:/|$) {
            proxy_pass http://127.0.0.1:8081;
        }

        location / {
            return 404;
        }
    }
}
