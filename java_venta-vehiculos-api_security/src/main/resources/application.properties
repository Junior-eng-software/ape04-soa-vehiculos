# Configurar las variables referenciadas mediante el entorno o el archivo local.
# Ejecutar desde la raiz de este servicio para cargar config/application-local.properties.
spring.config.import=optional:file:./config/application-local.properties

# API de vehículos: solamente el equipo local.
server.port=8080
server.address=127.0.0.1

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# MySQL/MariaDB ya existente en XAMPP (NO crear otra base).
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/venta_vehiculos?useSSL=false&serverTimezone=UTC
spring.datasource.username=${VEHICULOS_DB_USER}
spring.datasource.password=${VEHICULOS_DB_PASSWORD}

# Verificar la estructura, sin crear ni modificar tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Autenticacion JWT y cliente: valores privados externalizados.
app.security.jwt-secret=${VEHICULOS_JWT_SECRET}
app.security.access-token-minutes=30
app.security.refresh-token-minutes=1440
app.security.client-id=vehiculos-client
app.security.client-secret=${VEHICULOS_CLIENT_SECRET}
# El cliente PWA se habilita con credenciales privadas distintas de las ordinarias.
app.security.pwa-client-id=${VEHICULOS_PWA_CLIENT_ID:}
app.security.pwa-client-secret=${VEHICULOS_PWA_CLIENT_SECRET:}

# DEBE coincidir con SERVICE_KEY en Python (longitud >= 32).
app.security.ventas-key=${VENTAS_SERVICE_KEY}

# Notificaciones Java: comparte la MISMA clave con Python.
servicios.notificaciones.url=http://127.0.0.1:8081
servicios.notificaciones.key=${NOTIFICACIONES_KEY}
servicios.notificaciones.destinatario=${VEHICULOS_NOTIFICACIONES_DESTINATARIO}

# SOLO si necesitas crear un usuario de prueba: activar temporalmente
# spring.profiles.active=local
app.bootstrap.user=${VEHICULOS_BOOTSTRAP_USER}
app.bootstrap.password=${VEHICULOS_BOOTSTRAP_PASSWORD}
app.bootstrap.role=ADMIN
