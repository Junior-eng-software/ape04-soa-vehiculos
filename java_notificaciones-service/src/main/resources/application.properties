# Configurar las variables referenciadas mediante el entorno o el archivo local.
# Ejecutar desde la raiz de este servicio para cargar config/application-local.properties.
spring.config.import=optional:file:./config/application-local.properties

spring.application.name=notificaciones-service
server.port=8081
server.address=127.0.0.1
#misma credencial x-notificacion-key utiliza por java y python
app.notificacion-key=${NOTIFICACIONES_KEY}
app.identidad-url=${NOTIFICACIONES_IDENTIDAD_URL:http://127.0.0.1:8090/api/identidad}

# El listener solo se crea al habilitarlo explícitamente, después de aplicar el SQL.
app.consumidor-ventas.activo=${NOTIFICACIONES_AMQP_ACTIVO:false}
